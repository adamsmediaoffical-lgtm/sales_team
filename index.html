<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سجل مكالمات السيلز</title>
<script>document.documentElement.lang='ar';document.documentElement.dir='rtl';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- مكتبات Firebase السحابية للربط اللحظي بين كل أجهزة التيم -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
/* Layout: deep-violet header with the day's call-result strip as the signature element; light working surface below; bottom tab bar on phones */
:root{
  --bg:#F4F1F9; --surface:#FFFFFF; --surface-2:#F8F6FC; --ink:#1D1428; --muted:#665B77; --line:#E3DCEE;
  --deep:#271245; --deep-2:#3B1D66; --deep-ink:#F2ECFC; --deep-muted:#B9A8D8;
  --primary:#6B2BD6; --on-primary:#FFFFFF; --violet:#6B2BD6; --violet-soft:#EEE5FC; --ring:#C59BFF;
  --good:#1E8A5C; --good-soft:#DDF3E8; --bad:#C03C4A; --bad-soft:#FBE3E6; --warn:#B8650F; --warn-soft:#FBEBD6; --info:#2B6CC4; --info-soft:#DFEAF8;
  /* نتيجة المكالمة */
  --s-deal:#0E7A4F; --s-interested:#2E9E66; --s-proposal:#6B2BD6; --s-followup:#2B6CC4; --s-busy:#C98A12; --s-noanswer:#DE7A2C; --s-notint:#8C84A0; --s-closed:#C03C4A; --s-wrong:#86303B;
  --shadow:0 1px 2px rgba(39,18,69,.06),0 8px 22px rgba(39,18,69,.07);
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110A1A; --surface:#1A1226; --surface-2:#22182F; --ink:#EEE7F8; --muted:#A698BD; --line:#322548;
    --deep:#0C0614; --deep-2:#241338; --deep-ink:#EEE7F8; --deep-muted:#9A88B8;
    --primary:#8350F0; --violet:#B58CFF; --violet-soft:#2C1D45; --ring:#C59BFF;
    --good:#4FC28B; --good-soft:#15301F; --bad:#EF6F7C; --bad-soft:#3A1A20; --warn:#E9A256; --warn-soft:#3A2915; --info:#78A8EC; --info-soft:#17263A;
    --s-deal:#3FC384; --s-interested:#6BD39A; --s-proposal:#A97BFF; --s-followup:#6FA3EE; --s-busy:#E6B24A; --s-noanswer:#F09A55; --s-notint:#9E96B4; --s-closed:#EF6F7C; --s-wrong:#C9656F;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#110A1A; --surface:#1A1226; --surface-2:#22182F; --ink:#EEE7F8; --muted:#A698BD; --line:#322548;
    --deep:#0C0614; --deep-2:#241338; --deep-ink:#EEE7F8; --deep-muted:#9A88B8;
    --primary:#8350F0; --violet:#B58CFF; --violet-soft:#2C1D45; --ring:#C59BFF;
    --good:#4FC28B; --good-soft:#15301F; --bad:#EF6F7C; --bad-soft:#3A1A20; --warn:#E9A256; --warn-soft:#3A2915; --info:#78A8EC; --info-soft:#17263A;
    --s-deal:#3FC384; --s-interested:#6BD39A; --s-proposal:#A97BFF; --s-followup:#6FA3EE; --s-busy:#E6B24A; --s-noanswer:#F09A55; --s-notint:#9E96B4; --s-closed:#EF6F7C; --s-wrong:#C9656F;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* ---------- header ---------- */
.top{background:var(--deep);color:var(--deep-ink)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:14px 0}
.bar1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.3}
.brand span{font-size:12.5px;color:var(--deep-muted)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--deep-muted)}
.me select{background:var(--deep-2);color:var(--deep-ink);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:6px 10px;font-size:14px;max-width:170px}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--deep-ink)}
.icon-btn:hover{background:rgba(255,255,255,.07)}
.icon-btn:focus-visible{outline:2px solid var(--ring)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px 10px 0 0;color:var(--deep-muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--deep-ink)}
.tabs button[aria-current="page"]{background:var(--bg);color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--ring)}
.badge{background:var(--bad);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;font-family:var(--display)}

.main{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:22px 70px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.4vw,28px);line-height:1.3;margin:0}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.4;color:var(--ink);text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.wa{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);background:transparent;border-color:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:32px}
.btn svg.i{width:17px;height:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-h{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.7}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.violet{background:var(--violet-soft);color:var(--violet)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--c)}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.heat{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.heat.hot{background:var(--bad-soft);color:var(--bad)}.heat.warm{background:var(--warn-soft);color:var(--warn)}.heat.cold{background:var(--info-soft);color:var(--info)}
.late{color:var(--bad)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px;outline:none;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.req{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:300px;flex:1 1 220px}
.toolbar select{width:auto;min-width:140px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button:focus-visible{outline:2px solid var(--violet)}

/* ---------- day header (signature) ---------- */
.day{background:var(--deep);color:var(--deep-ink);border-radius:18px;padding:22px 24px;margin-bottom:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 28px;align-items:center}
.daynav{display:flex;align-items:center;gap:6px}
.daynav .icon-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.14)}
.daydate{min-width:0}
.daydate b{display:block;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.2}
.daydate span{font-size:13px;color:var(--deep-muted)}
.daydate input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.tally{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.tally .big{font-family:var(--display);font-size:clamp(34px,4vw,48px);font-weight:600;line-height:1}
.tally .big small{font-size:14px;font-weight:400;color:var(--deep-muted);margin-inline-start:6px}
.tally .rate{font-size:14px;color:var(--deep-muted)}
.tally .rate b{color:var(--deep-ink);font-family:var(--display)}
.strip{grid-column:1/-1;display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.08);gap:2px}
.strip i{display:block;height:100%;background:var(--c);min-width:4px}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--deep-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend b{color:var(--deep-ink);font-family:var(--display);font-weight:600}
@media (max-width:760px){.day{grid-template-columns:1fr;padding:18px}.tally{gap:12px}}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.kpi{padding:14px 16px;border-inline-start:1px solid var(--line);min-width:0}
.kpi:first-child{border-inline-start:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3}
.kpi small{font-size:11.5px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-inline-start:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
.agents{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.agent{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer}
.agent[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.agent .av{width:24px;height:24px;font-size:11px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:600;font-size:13px;flex:none}
.agent b{font-family:var(--display)}
.prog{height:5px;width:46px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}

/* ---------- calls table ---------- */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--surface-2)}
.cname{font-weight:600;cursor:pointer}
.cname:hover{color:var(--violet)}
.csub{font-size:12.5px;color:var(--muted)}
.note{max-width:280px;font-size:13.5px;white-space:pre-wrap}
.stsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--c);background:var(--surface);width:auto;min-height:30px;cursor:pointer}
.phone{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.cards{display:none;flex-direction:column;gap:10px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ccard .r1{display:flex;align-items:flex-start;gap:10px}
.ccard .r1 .grow{flex:1;min-width:0}
.ccard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.ccard .nt{font-size:14px;background:var(--surface-2);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.ccard .fu{font-size:13px}
@media (max-width:860px){.table-wrap.calls{display:none}.cards{display:flex}}

/* ---------- follow-ups ---------- */
.fgroup{margin-bottom:18px}
.fgroup h3{font-family:var(--display);font-size:15.5px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.frow .grow{flex:1 1 260px;min-width:0}
.frow .when{font-family:var(--display);font-size:14px;font-weight:600;white-space:nowrap}
.frow .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- reports ---------- */
.rgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s6{grid-column:span 6}.s12{grid-column:span 12}
@media (max-width:980px){.s6{grid-column:span 12}}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin-bottom:9px}
.hb .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:5px;background:var(--c,var(--violet))}
.hours{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:170px;padding-top:18px}
.hour{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.hour .col{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--violet-soft);position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hour .col i{display:block;background:var(--good)}
.hour small{font-size:11px;color:var(--muted);font-family:var(--display)}
.hour .lbl{font-size:11px;font-family:var(--display);color:var(--ink)}

/* ---------- guide ---------- */
.guide{max-width:820px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:12px}
.guide h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px}
.guide p{margin:0 0 10px}.guide p:last-child{margin-bottom:0}
.guide ol,.guide ul{margin:6px 0 8px;padding-inline-start:22px}
.guide li{margin-bottom:6px}
.legend-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
.legend-list div{background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13.5px}
.sample{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.8}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,8,36,.55)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;gap:10px}
.dh h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px}
.dh .icon-btn{color:var(--muted)}
.dh .icon-btn:hover{background:var(--surface-2)}
.db{padding:8px 20px 12px}
.df{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 20px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
.df .r{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
.fsec{border:0;margin:0 0 14px;padding:0}
.fsec legend{font-family:var(--display);font-weight:600;font-size:14.5px;margin-bottom:8px;padding:0;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fgrid .w2{grid-column:span 2}.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .w2{grid-column:1/-1}}
.stpick{display:flex;flex-wrap:wrap;gap:6px}
.stpick label{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:500}
.stpick label::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.stpick input{position:absolute;opacity:0;width:1px;height:1px}
.stpick label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-weight:600}
.stpick label:has(input:focus-visible){outline:2px solid var(--violet);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}
.checks label:has(input:checked){background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.checks input{accent-color:var(--violet);margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{all:unset;cursor:pointer;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.quick button:hover{border-color:var(--violet);color:var(--violet)}
.quick button:focus-visible{outline:2px solid var(--violet)}
.hist{background:var(--info-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hist .grow{flex:1 1 260px;min-width:0}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .it{border-inline-start:3px solid var(--c);padding:6px 12px;background:var(--surface-2);border-radius:0 10px 10px 0}
.report-text{width:100%;min-height:300px;font-size:14px;line-height:1.75;font-family:var(--body)}

const SERVICES=['إدارة سوشيال ميديا','إعلانات ممولة','تصميم مواقع','هوية بصرية','تصوير وفيديو','SEO','كتابة محتوى','تغليف وبراندنج'];

const CALLS_COLLECTION='calls_data';
const SETTINGS_COLLECTION='system_config';
const SETTINGS_DOCUMENT='settings';
const LS='calls_log_v1';

const ICON={
  day:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
  follow:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/>',
  clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
  reports:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
  guide:'<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.5-2.7 4"/><path d="M12 17.5h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  prev:'<path d="M9 6l6 6-6 6"/>',next:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',
  send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;
const VIEWS=[['day','مكالمات اليوم','day','اليوم'],['follow','المتابعات','follow','المتابعات'],['clients','العملاء','clients','العملاء'],['reports','التقارير','reports','التقارير'],['guide','طريقة الاستخدام','guide','الشرح']];

/* =========================================================
   أدوات
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const ymOf=s=>s.slice(0,7);
const addMonthsYM=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const t12=s=>{if(!s||!/^\d{1,2}:\d{2}/.test(s))return '';let [h,m]=s.split(':').map(Number);const ap=h<12?'ص':'م';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const fday=s=>{try{return parseD(s).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}};
const fdayY=s=>{try{return parseD(s).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const fdate=s=>{try{return parseD(s).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'})}catch(e){return s}};
const relDay=s=>{const t=today();if(s===t)return 'النهارده';if(s===addDays(t,1))return 'بكرة';if(s===addDays(t,-1))return 'امبارح';return fday(s)};
const pkey=p=>{const d=String(p||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):d};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(' ');
const nf=new Intl.NumberFormat('en-US');
const nCalls=n=>n===1?'مكالمة واحدة':n===2?'مكالمتين':(n>=3&&n<=10)?`${n} مكالمات`:`${n} مكالمة`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* =========================================================
   الحالة والتخزين
   ========================================================= */
const S={calls:{},settings:{...DEF},loaded:new Set()};
const ui={view:'day',date:today(),q:'',agent:'',status:'',me:lsGet('calls_me',''),fAgent:'',cq:'',period:'week',ready:true};
try{const v=lsGet('calls_view','');if(VIEWS.some(x=>x[0]===v))ui.view=v}catch(e){}

const Store={
  mode:'local',db:null,subs:{},canWrite:true,
  lsLoad(){try{const o=JSON.parse(lsGet(LS,'null'));if(o){S.calls=o.calls||{};S.settings={...DEF,...(o.settings||{})}}}catch(e){}},
  lsSave(){if(this.mode==='local')lsSet(LS,JSON.stringify({calls:S.calls,settings:S.settings}))},
  err(e){
    console.error("Firestore Error:", e);
    const c=e&&e.code;
    if(c==='permission-denied')toast('معندكش صلاحية تعدّل، راجع الـ Rules في Firebase');
    else toast('تعذر الاتصال بالسيرفر، شغال محلياً مؤقتاً');
  },
  col(ym){return this.db.collection(CALLS_COLLECTION).doc(ym).collection('records')},
  settingsDoc(){return this.db.collection(SETTINGS_COLLECTION).doc(SETTINGS_DOCUMENT)},
  ensure(ym){
    if(this.mode!=='db'||!this.db)return;
    if(this.subs[ym])return;
    try{
      this.subs[ym]=this.col(ym).onSnapshot(s=>{
        for(const id in S.calls)if(S.calls[id].ym===ym)delete S.calls[id];
        s.docs.forEach(d=>{S.calls[d.id]={...d.data(),id:d.id,ym}});
        S.loaded.add(ym);scheduleRender();
      },err=>{console.warn("Sub error:", err);scheduleRender();});
    }catch(e){console.warn("Sub error:", e)}
  },
  async put(c,prev){
    const ym=ymOf(c.date);const rec={...c,ym};S.calls[c.id]=rec;scheduleRender();
    if(this.mode!=='db'||!this.db){this.lsSave();return true}
    const {id,ym:_y,...body}=rec;
    try{
      if(prev&&prev.ym&&prev.ym!==ym)await this.col(prev.ym).doc(id).delete();
      await this.col(ym).doc(id).set(body);this.ensure(ym);return true;
    }catch(e){this.err(e);if(prev)S.calls[c.id]=prev;else delete S.calls[c.id];scheduleRender();return false}
  },
  async del(c){
    delete S.calls[c.id];scheduleRender();
    if(this.mode!=='db'||!this.db){this.lsSave();return true}
    try{await this.col(c.ym).doc(c.id).delete();return true}catch(e){this.err(e);S.calls[c.id]=c;scheduleRender();return false}
  },
  async putSettings(p){
    S.settings={...S.settings,...p};scheduleRender();
    if(this.mode!=='db'||!this.db){this.lsSave();return}
    try{await this.settingsDoc().set(S.settings)}catch(e){this.err(e)}
  }
};

/* =========================================================
   حسابات
   ========================================================= */
const all=()=>Object.values(S.calls);
const dayCalls=d=>all().filter(c=>c.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||'')||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
const team=()=>(S.settings.team||[]).filter(x=>x&&x.name);
const agentNames=()=>{const s=new Set(team().map(x=>x.name));all().forEach(c=>c.agent&&s.add(c.agent));return [...s]};
const agentColor=n=>{const t=team();const i=t.findIndex(x=>x.name===n);if(i>=0)return AV_COLORS[i%AV_COLORS.length];let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))|0;return AV_COLORS[Math.abs(h)%AV_COLORS.length]};
const isAnswered=c=>ST[c.status]?.answered;
const callsOfKey=k=>k?all().filter(c=>c.pkey===k).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)):[];
const attemptNo=c=>c.pkey?callsOfKey(c.pkey).filter(x=>(x.date+(x.time||''))<=(c.date+(c.time||''))).length:1;
const openFollows=()=>all().filter(c=>c.followDate&&!c.followDone);
function summary(list){
  const o={total:list.length,answered:0,by:{}};STATUSES.forEach(s=>o.by[s.id]=0);
  list.forEach(c=>{if(o.by[c.status]!=null)o.by[c.status]++;if(isAnswered(c))o.answered++});
  o.followSet=list.filter(c=>c.followDate&&!c.followDone).length;
  o.hot=list.filter(c=>c.heat==='hot').length;
  return o;
}
function periodRange(p){
  const t=today();const d=parseD(t);
  if(p==='today')return [t,t];
  if(p==='week'){const dow=d.getDay();const back=(dow+1)%7;return [addDays(t,-back),t]}
  if(p==='month')return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){const ym=addMonthsYM(ymOf(t),-1);const e=new Date(Number(ym.slice(0,4)),Number(ym.slice(5)),0);return [ym+'-01',iso(e)]}
  return [t,t];
}

/* =========================================================
   الرسم

let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function render(){
  const a=document.activeElement;const fid=a&&a.id&&$('#main').contains(a)?a.id:null;let sel=null;try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  renderTop();
  const m=$('#main');

  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function followBadge(){const t=today();return openFollows().filter(c=>c.followDate<=t).length}
function renderTop(){
  const fb=followBadge();

    <label class="me"><span>أنا</span><select id="meSel" data-bind="me" aria-label="اسمك"><option value="">اختار اسمك</option>${names.map(n=>`<option ${ui.me===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <button class="icon-btn" data-act="nav" data-id="settings" aria-label="الإعدادات">${ico('settings')}</button>
  </div>
  <nav class="tabs" aria-label="الأقسام">${VIEWS.map(([id,n,ic])=>`<button data-act="nav" data-id="${id}" ${ui.view===id?'aria-current="page"':''}>${ico(ic)}${n}${id==='follow'&&fb?`<span class="badge">${fb}</span>`:''}</button>`).join('')}</nav>`;

}
const stChip=s=>{const x=ST[s];return x?`<span class="st" style="--c:${x.c}">${x.l}</span>`:'<span class="muted">—</span>'};
const heatChip=h=>h?`<span class="heat ${h}">${HEATL[h]}</span>`:'';
const av=(n,sz)=>`<span class="av" style="background:${agentColor(n)}${sz?`;width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px`:''}">${esc(initials(n))}</span>`;
function followTxt(c){
  if(!c.followDate)return '<span class="muted">—</span>';
  const t=today();const late=!c.followDone&&c.followDate<t;
  return `<span class="${late?'late':''}">${c.followDone?'<s>':''}${relDay(c.followDate)}${c.followTime?' '+t12(c.followTime):''}${c.followDone?'</s> ✓':''}</span>${c.nextStep&&c.nextStep!=='مفيش'?`<div class="csub">${esc(c.nextStep)}</div>`:''}`;
}

  const x=ST[c.status];
  if(!Store.canWrite)return stChip(c.status);
  return `<select class="stsel" data-act-change="status" data-id="${c.id}" style="--c:${x?x.c:'var(--muted)'}" aria-label="نتيجة المكالمة">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===c.status?'selected':''}>${s.l}</option>`).join('')}</select>`;
}

/* ---------- اليوم ---------- */
function vDay(){
  const d=ui.date,t=today();
  const ym=ymOf(d);
  const list0=dayCalls(d);
  const list=list0.filter(c=>(!ui.agent||c.agent===ui.agent)&&(!ui.status||c.status===ui.status)&&(!ui.q||[c.client,c.company,c.phone,c.notes,c.agent].some(v=>String(v||'').toLowerCase().includes(ui.q.toLowerCase()))));
  const sm=summary(ui.agent?list0.filter(c=>c.agent===ui.agent):list0);
  const segs=STATUSES.filter(s=>sm.by[s.id]).map(s=>`<i style="--c:${s.c};flex:${sm.by[s.id]}" title="${s.l}: ${sm.by[s.id]}"></i>`).join('');

    <td class="num muted">${i+1}</td>

    <td><span class="phone">${esc(c.phone||'—')}</span>${c.source?`<div class="csub">${esc(c.source)}</div>`:''}</td>
    <td>${statusSelect(c)}<div style="margin-top:4px">${heatChip(c.heat)}</div></td>
    <td class="note">${esc(c.notes||'')}${(c.services||[]).length?`<div class="csub">${esc(c.services.join('، '))}${c.budget?' — ميزانية: '+esc(c.budget):''}</div>`:''}</td>
    <td class="nw">${followTxt(c)}</td>
    <td class="nw"><span style="display:inline-flex;align-items:center;gap:6px">${c.agent?av(c.agent,24):''}${esc(c.agent||'—')}</span></td>
    <td>${Store.canWrite?`<button class="btn sm ghost" data-act="edit" data-id="${c.id}" aria-label="تعديل">${ico('edit')}</button>`:''}</td></tr>`}).join('');
  const cards=list.map(c=>{const at=attemptNo(c);return `<div class="ccard">
    <div class="r1"><div class="grow"><span class="cname" data-act="client" data-id="${c.id}">${esc(c.client||'—')}</span>${c.company?` <span class="csub">— ${esc(c.company)}</span>`:''}<div class="phone csub">${esc(c.phone||'')}</div></div>${Store.canWrite?`<button class="btn sm ghost" data-act="edit" data-id="${c.id}" aria-label="تعديل">${ico('edit')}</button>`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${statusSelect(c)}${heatChip(c.heat)}${at>1?`<span class="chip warn">محاولة ${at}</span>`:''}</div>
    ${c.notes?`<div class="nt">${esc(c.notes)}</div>`:''}
    <div class="meta"><span>${t12(c.time)||''}${c.channel?' — '+esc(c.channel):''}</span><span>${esc(c.agent||'')}</span>${(c.services||[]).length?`<span>${esc(c.services.join('، '))}</span>`:''}</div>
    ${c.followDate?`<div class="fu">المتابعة: ${followTxt(c)}</div>`:''}</div>`}).join('');
  const prevDay=addDays(d,-1),nextDay=addDays(d,1);
  return `<section class="day">
      <div class="daynav"><button class="icon-btn" data-act="go-day" data-id="${prevDay}" aria-label="اليوم اللي قبله">${ico('prev')}</button>
        <label class="daydate" style="cursor:pointer"><b>${relDay(d)==='النهارده'?'النهارده':esc(fday(d))}</b><span>${esc(fdayY(d))}</span><input type="date" id="dayPick" value="${d}" data-bind="date" aria-label="اختار يوم"></label>
        <button class="icon-btn" data-act="go-day" data-id="${nextDay}" aria-label="اليوم اللي بعده">${ico('next')}</button>
        ${d!==t?`<button class="btn sm" data-act="go-day" data-id="${t}" style="margin-inline-start:6px">النهارده</button>`:''}</div>
      <div class="tally"><span class="big num">${sm.total}<small>مكالمة${ui.agent?' لـ '+esc(ui.agent):''}</small></span><span class="rate">ردوا <b>${sm.answered}</b> (${pct(sm.answered,sm.total)}%) — متابعات اتحددت <b>${sm.followSet}</b></span></div>
      ${sm.total?`<div class="strip" role="img" aria-label="نتايج المكالمات">${segs}</div><div class="legend">${legend}</div>`:''}
    </section>
    <div class="head"><div><h1>مكالمات ${d===t?'النهارده':'يوم '+esc(fdate(d))}</h1><p>سجّل كل مكالمة أول ما تخلّصها، والتقرير بيتجمع لوحده</p></div>
      <div class="actions">${Store.canWrite?`<button class="btn primary" data-act="add">${ico('plus')}تسجيل مكالمة</button>`:''}<button class="btn wa" data-act="pdf" data-id="day">${ico('dl')}PDF للجروب</button><button class="btn" data-act="report">${ico('send')}رسالة واتساب</button><button class="btn" data-act="export-day">${ico('dl')}Excel</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>إجمالي</span><b>${sm.total}</b><small>مكالمة</small></div>
      <div class="kpi"><span>ردوا</span><b style="color:var(--good)">${sm.answered}</b><small>${pct(sm.answered,sm.total)}%</small></div>
      <div class="kpi"><span>مردوش / مغلق</span><b style="color:var(--s-noanswer)">${sm.by.noanswer+sm.by.closed+sm.by.wrong}</b><small>منهم ${sm.by.closed} مغلق</small></div>
      <div class="kpi"><span>مهتمين</span><b style="color:var(--s-interested)">${sm.by.interested+sm.by.proposal+sm.by.followup}</b><small>${sm.hot} حار</small></div>
      <div class="kpi"><span>عروض أسعار</span><b style="color:var(--s-proposal)">${sm.by.proposal}</b><small>طلبوا عرض</small></div>
      <div class="kpi"><span>صفقات</span><b style="color:var(--s-deal)">${sm.by.deal}</b><small>اتفقنا</small></div>
    </div>
    ${agents?`<div class="agents" role="group" aria-label="فلتر بعضو التيم">${agents}</div>`:''}
    <div class="toolbar"><input type="search" id="dq" data-bind="q" placeholder="دوّر باسم العميل أو الرقم أو الملاحظة" value="${esc(ui.q)}" aria-label="بحث">
      <select id="dst" data-bind="status" aria-label="النتيجة"><option value="">كل النتايج</option>${STATUSES.map(s=>`<option value="${s.id}" ${ui.status===s.id?'selected':''}>${s.l}</option>`).join('')}</select>
      ${ui.agent||ui.status||ui.q?`<button class="btn sm ghost" data-act="clear-filters">شيل الفلاتر</button>`:''}</div>
    ${list.length?`<div class="panel table-wrap calls"><table class="t"><thead><tr><th>#</th><th>الوقت</th><th>العميل</th><th>التليفون</th><th>النتيجة</th><th>ملاحظات العميل</th><th>المتابعة</th><th>من التيم</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="cards">${cards}</div>`
      :`<div class="panel empty">${list0.length?'مفيش مكالمات بالفلتر ده':(d===t?'لسه مفيش مكالمات النهارده. دوس "تسجيل مكالمة" بعد كل مكالمة تعملها، وآخر اليوم ابعت التقرير للجروب بدوسة واحدة.':'مفيش مكالمات متسجلة اليوم ده')}${!list0.length&&Store.canWrite&&!all().length?'<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="add">'+ico('plus')+'سجّل أول مكالمة</button><button class="btn" data-act="seed">جرّب ببيانات تجريبية</button></div>':''}</div>`}`;
}

/* ---------- المتابعات ---------- */
function vFollow(){
  const t=today();const tm=addDays(t,1);const wk=addDays(t,7);
  const list=openFollows().filter(c=>!ui.fAgent||c.agent===ui.fAgent).sort((a,b)=>(a.followDate+(a.followTime||'99')).localeCompare(b.followDate+(b.followTime||'99')));
  const groups=[['متأخرة','bad',c=>c.followDate<t],['النهارده','violet',c=>c.followDate===t],['بكرة','info',c=>c.followDate===tm],['خلال الأسبوع','',c=>c.followDate>tm&&c.followDate<=wk],['بعد كده','',c=>c.followDate>wk]];
  const row=c=>`<div class="frow"><div class="grow"><span class="cname" data-act="client" data-id="${c.id}">${esc(c.client||'—')}</span>${c.company?` <span class="csub">— ${esc(c.company)}</span>`:''} <span class="phone csub">${esc(c.phone||'')}</span>
      <div class="csub" style="margin-top:2px">${stChip(c.status)} — آخر مكالمة ${relDay(c.date)} مع ${esc(c.agent||'—')}${c.nextStep&&c.nextStep!=='مفيش'?' — المطلوب: <b>'+esc(c.nextStep)+'</b>':''}</div>
      ${c.notes?`<div class="csub" style="color:var(--ink);margin-top:2px">${esc(c.notes)}</div>`:''}</div>
    <span class="when ${c.followDate<t?'late':''}">${relDay(c.followDate)}${c.followTime?' '+t12(c.followTime):''}</span>
    ${Store.canWrite?`<div class="acts"><button class="btn sm primary" data-act="log-follow" data-id="${c.id}">${ico('phone')}سجّل المكالمة</button><button class="btn sm" data-act="follow-done" data-id="${c.id}">${ico('check')}تمت</button><button class="btn sm ghost" data-act="follow-tomorrow" data-id="${c.id}">أجّل لبكرة</button></div>`:''}</div>`;
  const body=groups.map(([n,tone,f])=>{const g=list.filter(f);if(!g.length)return '';return `<div class="fgroup"><h3>${n} <span class="chip ${tone}">${g.length}</span></h3>${g.map(row).join('')}</div>`}).join('');
  const names=agentNames();
  return `<div class="head"><div><h1>المتابعات</h1><p>كل عميل اتحددله ميعاد متابعة ولسه ما اتكلمش</p></div><div class="actions"><button class="btn wa" data-act="pdf" data-id="follow">${ico('dl')}PDF</button></div></div>
    <div class="toolbar"><select id="fAgent" data-bind="fAgent" aria-label="عضو التيم"><option value="">كل التيم</option>${names.map(n=>`<option ${ui.fAgent===n?'selected':''}>${esc(n)}</option>`).join('')}</select>${ui.me?`<button class="btn sm ${ui.fAgent===ui.me?'primary':''}" data-act="my-follows">متابعاتي أنا</button>`:''}</div>
    ${body||'<div class="panel empty">مفيش متابعات مفتوحة. أي مكالمة بتحددلها ميعاد متابعة هتظهر هنا في يومها.</div>'}`;
}

/* ---------- العملاء ---------- */
function clientsIndex(){
  const map={};
  all().forEach(c=>{const k=c.pkey||('n:'+String(c.client||'').trim());if(!k||k==='n:')return;
    const o=map[k]=map[k]||{k,calls:[],};o.calls.push(c)});
  return Object.values(map).map(o=>{o.calls.sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));o.last=o.calls[0];o.follow=o.calls.find(c=>c.followDate&&!c.followDone);return o})
    .sort((a,b)=>(b.last.date+(b.last.time||'')).localeCompare(a.last.date+(a.last.time||'')));
}
function vClients(){
  const q=ui.cq.trim().toLowerCase();
  const list=clientsIndex().filter(o=>!q||o.calls.some(c=>[c.client,c.company,c.phone].some(v=>String(v||'').toLowerCase().includes(q))));
  const rows=list.slice(0,400).map(o=>{const c=o.last;return `<tr><td><span class="cname" data-act="client" data-id="${c.id}">${esc(c.client||'—')}</span>${c.company?`<div class="csub">${esc(c.company)}</div>`:''}</td><td><span class="phone">${esc(c.phone||'—')}</span></td><td class="hide-sm">${esc(c.industry||'—')}</td><td>${stChip(c.status)}${heatChip(c.heat)?'<div style="margin-top:4px">'+heatChip(c.heat)+'</div>':''}</td><td class="nw">${relDay(c.date)}<div class="csub">${esc(c.agent||'')}</div></td><td class="num">${o.calls.length}</td><td class="nw hide-sm">${o.follow?followTxt(o.follow):'<span class="muted">—</span>'}</td></tr>`}).join('');
  return `<div class="head"><div><h1>العملاء</h1><p>كل عميل اتكلمنا معاه آخر شهرين، وآخر حاجة حصلت معاه</p></div><div class="actions"><button class="btn wa" data-act="pdf" data-id="clients">${ico('dl')}PDF</button></div></div>
    <div class="toolbar"><input type="search" id="cq" data-bind="cq" placeholder="دوّر بالاسم أو الشركة أو الرقم" value="${esc(ui.cq)}" aria-label="بحث"></div>
    <div class="panel"><div class="table-wrap">${list.length?`<table class="t"><thead><tr><th>العميل</th><th>التليفون</th><th class="hide-sm">المجال</th><th>آخر نتيجة</th><th>آخر مكالمة</th><th>مرات</th><th class="hide-sm">المتابعة الجاية</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">مفيش عملاء لسه</div>'}</div></div>
    <p class="muted" style="font-size:13px">اضغط على اسم أي عميل عشان تشوف كل مكالماته. ولو بتدوّر على عميل أقدم من شهرين، افتح صفحته واضغط "دوّر في الشهور القديمة".</p>`;
}

/* ---------- التقارير ---------- */
function vReports(){
  const [a,b]=periodRange(ui.period);
  for(let ym=ymOf(a);ym<=ymOf(b);ym=addMonthsYM(ym,1))Store.ensure(ym);
  const list=all().filter(c=>c.date>=a&&c.date<=b);
  const sm=summary(list);
  const P={today:'النهارده',week:'الأسبوع ده',month:'الشهر ده',lastmonth:'الشهر اللي فات'};
  const maxSt=Math.max(1,...STATUSES.map(s=>sm.by[s.id]));
  const stBars=STATUSES.map(s=>`<div class="hb"><span>${s.l}</span><div class="track"><i style="--c:${s.c};width:${sm.by[s.id]/maxSt*100}%"></i></div><span class="num">${sm.by[s.id]}</span></div>`).join('');
  const per={};list.forEach(c=>{const k=c.agent||'من غير اسم';const o=per[k]=per[k]||{n:0,a:0,int:0,prop:0,deal:0,days:new Set()};o.n++;o.days.add(c.date);if(isAnswered(c))o.a++;if(['interested','proposal','followup'].includes(c.status))o.int++;if(c.status==='proposal')o.prop++;if(c.status==='deal')o.deal++});
  const agRows=Object.entries(per).sort((x,y)=>y[1].n-x[1].n).map(([n,o])=>`<tr><td class="nw"><span style="display:inline-flex;gap:8px;align-items:center">${av(n,26)}${esc(n)}</span></td><td class="num">${o.n}</td><td class="num">${Math.round(o.n/o.days.size)}</td><td class="num">${o.a} <span class="muted">(${pct(o.a,o.n)}%)</span></td><td class="num">${o.int}</td><td class="num">${o.prop}</td><td class="num"><b>${o.deal}</b></td></tr>`).join('');
  const src={};list.forEach(c=>{const k=c.source||'مش متسجل';const o=src[k]=src[k]||{n:0,int:0};o.n++;if(['interested','proposal','followup','deal'].includes(c.status))o.int++});
  const maxSrc=Math.max(1,...Object.values(src).map(o=>o.n));
  const srcBars=Object.entries(src).sort((x,y)=>y[1].n-x[1].n).map(([k,o])=>`<div class="hb"><span>${esc(k)}</span><div class="track"><i style="width:${o.n/maxSrc*100}%"></i></div><span class="num">${o.n} <span class="muted">(${o.int} مهتم)</span></span></div>`).join('');
  const hrs={};for(let h=9;h<=21;h++)hrs[h]={n:0,a:0};
  list.forEach(c=>{const h=Number(String(c.time||'').slice(0,2));if(hrs[h]){hrs[h].n++;if(isAnswered(c))hrs[h].a++}});
  const maxH=Math.max(1,...Object.values(hrs).map(o=>o.n));
  const best=Object.entries(hrs).filter(([h,o])=>o.n>=3).sort((x,y)=>(y[1].a/y[1].n)-(x[1].a/x[1].n))[0];
  const hours=Object.entries(hrs).map(([h,o])=>`<div class="hour" title="${t12(pad(h)+':00')}: ${o.n} مكالمة، ردوا ${o.a}"><span class="lbl">${o.n?pct(o.a,o.n)+'%':''}</span><div class="col" style="height:${Math.max(4,o.n/maxH*100)}%"><i style="height:${o.n?o.a/o.n*100:0}%"></i></div><small>${Number(h)%12||12}</small></div>`).join('');
  return `<div class="head"><div><h1>التقارير</h1><p>${P[ui.period]}: من ${esc(fdate(a))} لـ ${esc(fdate(b))}</p></div>
    <div class="actions"><div class="seg" role="group">${Object.entries(P).map(([k,v])=>`<button data-act="period" data-id="${k}" aria-pressed="${ui.period===k}">${v}</button>`).join('')}</div><button class="btn wa" data-act="pdf" data-id="period">${ico('dl')}PDF للفترة دي</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>إجمالي المكالمات</span><b>${sm.total}</b><small>${new Set(list.map(c=>c.pkey||c.client)).size} عميل</small></div>
      <div class="kpi"><span>نسبة الرد</span><b style="color:var(--good)">${pct(sm.answered,sm.total)}%</b><small>${sm.answered} رد</small></div>
      <div class="kpi"><span>مهتمين</span><b style="color:var(--s-interested)">${sm.by.interested+sm.by.proposal+sm.by.followup}</b><small>${pct(sm.by.interested+sm.by.proposal+sm.by.followup,sm.answered)}% من اللي ردوا</small></div>
      <div class="kpi"><span>عروض أسعار</span><b style="color:var(--s-proposal)">${sm.by.proposal}</b><small>طلبوا عرض</small></div>
      <div class="kpi"><span>صفقات</span><b style="color:var(--s-deal)">${sm.by.deal}</b><small>${pct(sm.by.deal,sm.total)}% من المكالمات</small></div>
      <div class="kpi"><span>أرقام مغلقة أو غلط</span><b style="color:var(--s-closed)">${sm.by.closed+sm.by.wrong}</b><small>محتاجة تتنضف</small></div>
    </div>
    <div class="rgrid">
      <section class="panel s12"><div class="panel-h">أداء التيم ${list.length?`<button class="btn sm" data-act="export-range">${ico('dl')}تصدير Excel</button>`:''}</div>${agRows?`<div class="table-wrap"><table class="t"><thead><tr><th>العضو</th><th>مكالمات</th><th>متوسط في اليوم</th><th>ردوا</th><th>مهتمين</th><th>عروض أسعار</th><th>صفقات</th></tr></thead><tbody>${agRows}</tbody></table></div>`:'<div class="empty">مفيش مكالمات في الفترة دي</div>'}</section>
      <section class="panel s6"><div class="panel-h">نتايج المكالمات</div>${sm.total?stBars:'<div class="empty">مفيش بيانات</div>'}</section>
      <section class="panel s6"><div class="panel-h">أحسن وقت للاتصال <small>ارتفاع العمود = عدد المكالمات، الأخضر = اللي ردوا</small></div>${sm.total?`<div class="hours">${hours}</div><p class="muted" style="font-size:13px;margin:10px 0 0">${best?`أعلى نسبة رد كانت الساعة ${t12(pad(best[0])+':00')} (${pct(best[1].a,best[1].n)}%).`:'محتاجين مكالمات أكتر عشان نعرف أحسن وقت.'}</p>`:'<div class="empty">مفيش بيانات</div>'}</section>
      <section class="panel s12"><div class="panel-h">مصادر الأرقام <small>عدد المكالمات وكام واحد منهم طلع مهتم</small></div>${srcBars||'<div class="empty">مفيش بيانات</div>'}</section>
    </div>`;
}

/* ---------- الإعدادات ---------- */

/* ---------- طريقة الاستخدام ---------- */
function vGuide(){
  const sample=buildReport(today(),{details:true,phones:false,follows:true,agent:''},true);
  return `<div class="head"><div><h1>طريقة الاستخدام</h1><p>إزاي التيم يسجل مكالماته، وإزاي التقرير يتبعت للجروب</p></div></div>
  <div class="guide">
  <section><h2>فكرة السجل</h2><p>ده سجل واحد مشترك لكل تيم السيلز. كل واحد بيسجل كل مكالمة بيعملها أول ما يخلّصها: مين العميل، رقمه، رد ولا لأ، قال إيه، والمتابعة معاه إمتى. كل اللي بيتسجل بيظهر للكل على طول، وآخر اليوم بيطلع تقرير جاهز تبعته للجروب بدوسة واحدة.</p></section>
  <section><h2>أول مرة</h2><ol><li>المدير يفتح <b>الإعدادات</b> (الترس فوق) ويكتب اسم الشركة، ويضيف أسماء التيم، ويحدد تارجت المكالمات اليومي لكل واحد لو عايز.</li><li>يشارك اللينك مع التيم بصلاحية <b>تعديل</b>، مش "عرض فقط"، عشان يقدروا يسجلوا.</li><li>كل عضو يختار اسمه من خانة <b>"أنا"</b> فوق. الجهاز بيفتكره، فاسمه بيتكتب لوحده في كل مكالمة.</li></ol></section>
  <section><h2>تسجيل مكالمة</h2><ol><li>دوس <b>"تسجيل مكالمة"</b>.</li><li>اكتب اسم العميل ورقمه. لو الرقم اتكلم قبل كده، هيظهرلك كام مرة وآخر حاجة حصلت، ودوسة على "املأ البيانات" بتجيب الاسم والشركة والمجال لوحدهم.</li><li>اختار <b>نتيجة المكالمة</b> (الألوان تحت).</li><li>اكتب في <b>ملاحظات العميل</b> اللي قاله بالظبط: محتاج إيه، ميزانيته، اعتراضاته، مين صاحب القرار.</li><li>حدد <b>الخطوة الجاية</b> و<b>ميعاد المتابعة</b>. الأزرار السريعة (بكرة، بعد يومين، الأسبوع الجاي) بتوفر وقت، والسيستم بيقترح ميعاد لوحده حسب النتيجة.</li><li>دوس <b>"حفظ"</b>، أو <b>"حفظ وسجّل اللي بعده"</b> لو وراك مكالمات كتير ورا بعض.</li></ol>
    <p>الوقت والتاريخ بيتكتبوا لوحدهم. وتقدر تغيّر نتيجة أي مكالمة من الجدول على طول من غير ما تفتحها.</p></section>
  <section><h2>نتايج المكالمة</h2><div class="legend-list">${STATUSES.map(s=>`<div><span class="st" style="--c:${s.c}">${s.l}</span><div class="muted" style="font-size:12.5px;margin-top:2px">${{interested:'رد وعنده اهتمام حقيقي بخدماتنا.',proposal:'طلب عرض سعر أو تفاصيل الأسعار.',followup:'رد بس محتاج يفكر أو يرجع لحد. لازم ميعاد متابعة.',deal:'اتفقنا معاه أو وافق يبدأ.',notint:'رد وقال مش محتاج دلوقتي.',busy:'رد وقال كلمني في وقت تاني.',noanswer:'الرقم بيرن ومحدش رد.',closed:'الموبايل مقفول أو خارج الخدمة.',wrong:'الرقم مش بتاع الشخص ده أو مش موجود.'}[s.id]} ${s.follow?`المتابعة المقترحة: بعد ${s.follow===1?'يوم':s.follow+' أيام'}.`:''}</div></div>`).join('')}</div>
    <p><b>درجة الاهتمام</b> (حار، دافي، بارد) بتساعد المدير يعرف مين يركز عليه. و<b>"محاولة 2، 3…"</b> بتظهر لوحدها لما نكلم نفس الرقم أكتر من مرة.</p></section>
  <section><h2>المتابعات</h2><p>أي مكالمة ليها ميعاد متابعة بتظهر في صفحة <b>المتابعات</b>، مقسمة: متأخرة، النهارده، بكرة، خلال الأسبوع، وبعد كده. والرقم الأحمر جنب المتابعات فوق هو عدد اللي ميعادهم جه أو عدّى.</p>
    <ul><li><b>سجّل المكالمة:</b> بتفتح مكالمة جديدة ببيانات العميل جاهزة، ولما تحفظها المتابعة القديمة بتتقفل لوحدها.</li><li><b>تمت:</b> لو اتعاملت مع المتابعة من غير مكالمة جديدة.</li><li><b>أجّل لبكرة:</b> لو مالحقتش النهارده.</li><li>زرار <b>"متابعاتي أنا"</b> بيوريك متابعاتك انت بس.</li></ul></section>
  <section><h2>تقرير PDF للجروب</h2><p>ده أسهل طريقة تبعت بيها يوم كامل للجروب: ملف PDF بنفس شكل السجل بالظبط، بالهيدر البنفسجي وشريط النتايج والأرقام وجدول كل المكالمات بالملاحظات والمتابعات.</p><p>وفي زرار PDF في كل صفحة: <b>المتابعات</b> (مقسمة متأخرة والنهارده وبكرة)، و<b>العملاء</b> (آخر حالة لكل عميل)، و<b>التقارير</b> (الأسبوع أو الشهر بأداء التيم وكل المكالمات). ومن الإعدادات تختار تظهر أرقام التليفونات في الملفات ولا لأ.</p><ol><li>من صفحة اليوم دوس <b>"PDF للجروب"</b>، والملف بينزل على طول.</li><li>لو عايز تقرير عضو واحد بس، دوس على اسمه في صف التيم الأول وبعدين دوس PDF.</li><li>ابعت الملف لجروب الشركة على واتساب كملف (Document).</li></ol><p>الملف مقاس A4، ولو المكالمات كتير بيتقسم صفحات لوحده ورأس الجدول بيتكرر في كل صفحة، وفي آخر كل صفحة رقمها وميعاد ما اتعمل.</p></section>
  <section><h2>أو رسالة واتساب مكتوبة</h2><ol><li>من صفحة اليوم دوس <b>"رسالة واتساب"</b>.</li><li>اختار تبعت إيه: الملخص بس ولا كل المكالمات بالتفاصيل، وتبين أرقام التليفونات ولا لأ، وتضيف متابعات بكرة، وتبعت تقرير عضو واحد بس لو حابب.</li><li>تقدر تعدّل الرسالة نفسها قبل ما تبعتها.</li><li>دوس <b>"افتح واتساب"</b> واختار جروب الشركة. ولو الرسالة طويلة أو واتساب ما فتحش، دوس <b>"انسخ الرسالة"</b> والزقها في الجروب.</li></ol>
    <p>شكل التقرير بيبقى كده (من مكالمات النهارده):</p><div class="sample">${esc(sample)}</div></section>
  <section><h2>العملاء والتاريخ</h2><p>صفحة <b>العملاء</b> فيها كل عميل اتكلمنا معاه، آخر نتيجة، آخر مرة، وعدد المكالمات. اضغط على اسم أي عميل (في أي صفحة) تشوف كل مكالماته من الأول للآخر مين كلمه وقال إيه. والسجل بيتحمّل آخر شهرين، ولو العميل أقدم دوس "دوّر في الشهور القديمة".</p></section>
  <section><h2>التقارير</h2><ul><li>اختار الفترة: النهارده، الأسبوع، الشهر، أو الشهر اللي فات.</li><li><b>أداء التيم:</b> عدد مكالمات كل واحد، ومتوسطه في اليوم، ونسبة الرد، والمهتمين، والعروض، والصفقات.</li><li><b>أحسن وقت للاتصال:</b> بيوريك أنهي ساعة الناس بترد فيها أكتر، عشان تركزوا المكالمات فيها.</li><li><b>مصادر الأرقام:</b> أنهي مصدر (إعلانات فيسبوك، إحالات، داتا قديمة…) بيجيب ناس مهتمة أكتر.</li><li>تقدر تصدّر أي فترة Excel.</li></ul></section>
  <section><h2>على الموبايل</h2><ul><li>افتح لينك السجل من الموبايل، بنفس الإيميل اللي اتشارك معاك.</li><li>زرار <b>"+ تسجيل مكالمة"</b> بيفضل ظاهر تحت على طول، والصفحات في الشريط اللي تحت.</li><li>عشان يبقى زي الأبلكيشن على شاشتك: في الآيفون افتحه في Safari ← زرار المشاركة ← <b>Add to Home Screen</b>. وفي الأندرويد افتحه في Chrome ← ⋮ ← <b>Add to Home screen</b>.</li><li>ملفات الـ PDF والإكسيل بتنزل على الموبايل زي أي ملف، وتبعتها من واتساب على طول.</li></ul></section>
  <section><h2>نصايح للتيم</h2><ul><li>سجّل المكالمة أول ما تقفل، قبل ما تنسى اللي العميل قاله.</li><li>اكتب كلام العميل نفسه في الملاحظات، مش "تمام" أو "هيرد".</li><li>متقفلش مكالمة "رد ومحتاج متابعة" من غير ميعاد.</li><li>الأرقام المغلقة جرّبها مرة أو اتنين في أوقات مختلفة قبل ما تعتبرها ميتة.</li><li>ابدأ يومك من صفحة المتابعات، وبعدين الأرقام الجديدة.</li></ul></section>
  <section><h2>البيانات</h2><ul><li>السجل متخزن أونلاين، وكل الشهور محفوظة. الصفحة بتعرض آخر شهرين، والأيام القديمة بتتحمّل لما تفتحها.</li><li>صدّر كل شهر Excel من الإعدادات كنسخة احتياطية.</li><li>"إضافة بيانات تجريبية" بتضيف مكالمات وهمية تجرب عليها، و"مسح البيانات التجريبية بس" بيشيلها من غير ما يلمس بياناتك.</li></ul></section>
  </div>`;
}

/* =========================================================

const dlg=$('#dlg'),dlg2=$('#dlg2');
const xBtn=`<button type="button" class="icon-btn" data-close aria-label="إغلاق">${ico('x')}</button>`;
function opt(list,val,empty='—'){return `<option value="">${empty}</option>`+list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}
function openCall(id,pre){
  const c=id?S.calls[id]:null;
  const v=c?{...c}:{date:today(),time:nowHM(),channel:'مكالمة صادرة',agent:ui.me||'',status:'',services:[],...(pre||{})};
  const names=agentNames();
  let followTouched=!!(c&&c.followDate)||!!(pre&&pre.followDate);
  dlg.innerHTML=`<form id="callForm" novalidate>
   <div class="dh"><h3>${c?'تعديل المكالمة':(pre&&pre.linkFrom?'مكالمة متابعة':'تسجيل مكالمة')}</h3>${xBtn}</div>
   <div class="db">
    <div id="histBox"></div>
    <fieldset class="fsec"><legend>بيانات العميل</legend><div class="fgrid">
      <label class="f"><span>اسم العميل <span class="req">*</span></span><input type="text" name="client" id="fClient" value="${esc(v.client||'')}" required autocomplete="off"></label>
      <label class="f">الشركة / البراند<input type="text" name="company" value="${esc(v.company||'')}"></label>
      <label class="f"><span>التليفون <span class="req">*</span></span><input type="tel" name="phone" id="fPhone" dir="ltr" value="${esc(v.phone||'')}" inputmode="tel" autocomplete="off"></label>
      <label class="f">المجال<select name="industry">${opt(INDUSTRIES,v.industry)}</select></label>
      <label class="f">مصدر الرقم<select name="source">${opt(SOURCES,v.source)}</select></label>
      <label class="f">المنطقة / المدينة<input type="text" name="city" value="${esc(v.city||'')}"></label>
    </div></fieldset>
    <fieldset class="fsec"><legend>المكالمة</legend><div class="fgrid">
      <label class="f">التاريخ<input type="date" name="date" value="${esc(v.date)}" required></label>
      <label class="f">الساعة<input type="time" name="time" value="${esc(v.time||'')}"></label>
      <label class="f">نوع التواصل<select name="channel">${opt(CHANNELS,v.channel)}</select></label>
      <label class="f"><span>من التيم <span class="req">*</span></span><input type="text" name="agent" list="agentList" value="${esc(v.agent||'')}" required placeholder="اسمك"><datalist id="agentList">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
      <label class="f">مدة المكالمة (دقايق)<input type="number" name="duration" min="0" value="${esc(v.duration||'')}"></label>
      <label class="f">الميزانية التقريبية<input type="text" name="budget" value="${esc(v.budget||'')}" placeholder="مثال: 10 آلاف في الشهر"></label>
      <div class="f full"><span style="font-size:13px;color:var(--muted);font-weight:500">نتيجة المكالمة <span class="req">*</span></span><div class="stpick" role="radiogroup">${STATUSES.map(s=>`<label style="--c:${s.c}"><input type="radio" name="status" value="${s.id}" ${v.status===s.id?'checked':''}>${s.l}</label>`).join('')}</div></div>
      <div class="f"><span style="font-size:13px;color:var(--muted);font-weight:500">درجة الاهتمام</span><div class="stpick">${HEAT.map(h=>`<label style="--c:var(--${h.v==='hot'?'bad':h.v==='warm'?'warn':'info'})"><input type="radio" name="heat" value="${h.v}" ${v.heat===h.v?'checked':''}>${h.l}</label>`).join('')}</div></div>
      <div class="f w2"><span style="font-size:13px;color:var(--muted);font-weight:500">الخدمات اللي سأل عليها</span><div class="checks">${SERVICES.map(s=>`<label><input type="checkbox" name="services" value="${esc(s)}" ${(v.services||[]).includes(s)?'checked':''}>${esc(s)}</label>`).join('')}</div></div>
    </div></fieldset>
    <fieldset class="fsec"><legend>الملاحظات والمتابعة</legend><div class="fgrid">
      <label class="f full">ملاحظات العميل (قال إيه بالظبط)<textarea name="notes" placeholder="مثال: عنده مطعم في المحلة ومحتاج سوشيال وإعلانات، الميزانية لسه مش محددة، صاحب القرار أخوه">${esc(v.notes||'')}</textarea></label>
      <label class="f">الخطوة الجاية<select name="nextStep">${opt(NEXT,v.nextStep)}</select></label>
      <label class="f">ميعاد المتابعة<input type="date" name="followDate" id="fFollowDate" value="${esc(v.followDate||'')}"><div class="quick">${[['بكرة',1],['بعد يومين',2],['الأسبوع الجاي',7],['مفيش',0]].map(([n,d])=>`<button type="button" data-follow="${d}">${n}</button>`).join('')}</div></label>
      <label class="f">الساعة<input type="time" name="followTime" value="${esc(v.followTime||'')}"></label>
      <label class="f full">ملاحظة داخلية للتيم (مش هتروح للعميل)<input type="text" name="internal" value="${esc(v.internal||'')}" placeholder="مثال: كلّمه بعد الضهر، الصبح مش بيرد"></label>
    </div></fieldset>
   </div>
   <div class="df">${c?'<button type="button" class="btn danger" data-del>حذف</button>':''}<div class="r"><button type="button" class="btn" data-close>إلغاء</button>${!c?'<button type="submit" class="btn" data-again="1">حفظ وسجّل اللي بعده</button>':''}<button type="submit" class="btn primary">حفظ</button></div></div>
  </form>`;
  const f=dlg.querySelector('#callForm');
  const fd=f.querySelector('#fFollowDate');
  const setFollow=n=>{fd.value=n?addDays(f.date.value||today(),n):'';if(!n)f.followTime.value=''};
  f.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{followTouched=true;setFollow(Number(b.dataset.follow))});
  fd.addEventListener('input',()=>followTouched=true);
  f.querySelectorAll('input[name=status]').forEach(r=>r.addEventListener('change',()=>{const s=ST[r.value];if(!followTouched&&s){setFollow(s.follow);if(s.follow===0&&!f.nextStep.value)f.nextStep.value='مفيش'}}));
  const showHist=()=>{const k=pkey(f.phone.value);const box=dlg.querySelector('#histBox');if(k.length<8){box.innerHTML='';return}
    const prev=callsOfKey(k).filter(x=>!c||x.id!==c.id);if(!prev.length){box.innerHTML='';return}
    const l=prev[prev.length-1];
    box.innerHTML=`<div class="hist"><div class="grow">الرقم ده اتكلم قبل كده <b>${prev.length} ${prev.length===1?'مرة':'مرات'}</b>. آخر مرة ${relDay(l.date)} مع ${esc(l.agent||'—')}: ${stChip(l.status)}${l.notes?`<div class="csub" style="color:var(--ink)">${esc(l.notes)}</div>`:''}</div>${!c?'<button type="button" class="btn sm" data-fill>املأ البيانات</button>':''}</div>`;
    const fb=box.querySelector('[data-fill]');if(fb)fb.onclick=()=>{['client','company','industry','source','city','budget'].forEach(k=>{if(l[k]&&!f[k].value)f[k].value=l[k]});(l.services||[]).forEach(s=>{const cb=f.querySelector(`input[name=services][value="${CSS.escape(s)}"]`);if(cb)cb.checked=true});if(l.heat&&!f.querySelector('input[name=heat]:checked')){const h=f.querySelector(`input[name=heat][value=${l.heat}]`);if(h)h.checked=true}toast('اتملت بيانات العميل')}};
  f.phone.addEventListener('input',showHist);showHist();
  let again=false;
  f.querySelectorAll('[type=submit]').forEach(b=>b.addEventListener('click',()=>again=!!b.dataset.again));
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const fdv=new FormData(f);const o={};
    ['client','company','phone','industry','source','city','date','time','channel','agent','duration','budget','notes','nextStep','followDate','followTime','internal'].forEach(k=>o[k]=String(fdv.get(k)||'').trim());
    o.status=fdv.get('status')||'';o.heat=fdv.get('heat')||'';o.services=fdv.getAll('services');
    if(!o.client){toast('اكتب اسم العميل');f.client.focus();return}
    if(!o.phone){toast('اكتب رقم التليفون');f.phone.focus();return}
    if(!o.status){toast('اختار نتيجة المكالمة');return}
    if(!o.agent){toast('اكتب اسمك في خانة "من التيم"');f.agent.focus();return}
    if(!o.date){toast('حدد التاريخ');return}

      if(c.notes)L.push(`📝 ${c.notes}`);

function pdfPaginate(items,head,m){
  const {H,M,FOOT}=PG;const maxY=H-FOOT-12;const pages=[];let pg=null,y=0;
  const mini={h:40,draw:(c,yy)=>{tx(c,`${S.settings.company||''} — ${m.kicker} — ${m.sub}`,PG.W-M,yy+24,pf(500,13),PC.muted);c.fillStyle=PC.line;c.fillRect(M,yy+34,PG.W-2*M,1)}};
  const newPage=()=>{pg=[];pages.push(pg);y=M;if(pages.length>1){pg.push({it:mini,y});y+=mini.h}};
  newPage();y=0;
  items.forEach(it=>{
    const need=it.isHead?it.h+70:it.h;
    if(y+need>maxY&&pg.length>(pages.length>1?1:0)){newPage();if(it.table&&!it.isHead){pg.push({it:head,y});y+=head.h}}
    pg.push({it,y});y+=it.h+(it.gap||(it.full?18:0));
  });
  return pages;
}

function cvJpeg(cv){return new Promise((res,rej)=>cv.toBlob(b=>{if(!b){rej(new Error('jpeg'));return}b.arrayBuffer().then(a=>res(new Uint8Array(a)),rej)},'image/jpeg',0.9))}
async function pagesToPdf(canvases){
  const enc=new TextEncoder();const chunks=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
  const obj=(n,fn)=>{offs[n]=len;push(`${n} 0 obj\n`);fn();push('\nendobj\n')};
  const PWt=595.28,PHt=841.89,n=canvases.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${canvases.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`));
  for(let i=0;i<n;i++){
    const cv=canvases[i];const jpg=await cvJpeg(cv);const p=3+i*3;
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PWt} ${PHt}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q ${PWt} 0 0 ${PHt} 0 0 cm /Im0 Do Q`;
    obj(p+1,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream')});
    obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream')});
  }
  const size=3+n*3;const xref=len;
  let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let k=1;k<size;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
/* تنزيل أي ملف: من الصفحة على طول */
async function saveBlob(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/csv;charset=utf-8'});
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return 'saved'}catch(e){return 'failed'}
}

  if(pdfBusy)return;pdfBusy=true;

  try{
    const m=pdfDoc(kind);const pages=await renderDoc(m);const blob=await pagesToPdf(pages);

    else if(r==='failed')toast('تعذر تنزيل الملف، حاول تاني');
  }catch(e){toast('تعذر تجهيز الـ PDF، حاول تاني')}
  finally{pdfBusy=false;if(btn){btn.disabled=false;btn.innerHTML=old}}
}

      items.push({id:'demo'+uid()+i,createdAt:Date.now(),updatedAt:Date.now(),demo:true,date:d,time,client:p[0],company:p[1],industry:p[2],phone:phones[pi],pkey:pkey(phones[pi]),source:pick(SOURCES.slice(0,7)),city:pick(['المحلة الكبرى','طنطا','المنصورة','القاهرة']),channel:pick(['مكالمة صادرة','مكالمة صادرة','مكالمة صادرة','واتساب','مكالمة واردة']),agent:pick(ag),status:st,heat:ST[st].answered&&!['notint','busy'].includes(st)?pick(['hot','warm','cold']):'',services:ST[st].answered?[pick(SERVICES.slice(0,5))]:[],budget:st==='proposal'?pick(['10 آلاف شهريًا','15 ألف','لسه مش محددة']):'',notes:pick(notesBy[st]),nextStep:st==='proposal'?'ابعت عرض سعر':st==='interested'?pick(['ابعت سابقة أعمال على واتساب','اجتماع أونلاين']):fol?'اتصال تاني':'مفيش',followDate:fol,followTime:fol?pick(['11:00','12:30','15:00','']):'',followDone:fol&&fol<t?R()<.6:false,duration:ST[st].answered?rint(2,12):'',internal:''});
    }}
  toast('جاري إضافة بيانات تجريبية…');
  for(const c of items){const ok=await Store.put(c,null);if(!ok)return}
  toast(`اتضافت ${items.length} مكالمة تجريبية`);
}
async function clearDemo(){
  const list=all().filter(c=>c.demo);
  if(!list.length){toast('مفيش بيانات تجريبية متحمّلة');return}
  if(!(await confirmBox(`هيتمسح ${list.length} مكالمة تجريبية. المكالمات الحقيقية مش هتتلمس.`,'امسح التجريبي')))return;
  for(const c of list){const ok=await Store.del(c);if(!ok)return}
  toast('اتمسحت البيانات التجريبية');
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'nav':ui.view=id;lsSet('calls_view',id);if(dlg.open)dlg.close();render();window.scrollTo(0,0);break;
    case 'add':openCall();break;
    case 'edit':openCall(id);break;
    case 'client':openClient(id);break;
    case 'go-day':ui.date=id;render();break;
    case 'agent-filter':ui.agent=ui.agent===id?'':id;render();break;
    case 'clear-filters':ui.agent='';ui.status='';ui.q='';render();break;
    case 'report':openReport();break;
    case 'pdf':exportPdf(id||'day',el);break;
    case 'pdf-phones':lsSet('pdf_phones',el.checked?'1':'0');break;
    case 'export-day':exportList(dayCalls(ui.date),`مكالمات-${ui.date}.csv`);break;
    case 'export-range':{const [a,b]=periodRange(ui.period);exportList(all().filter(c=>c.date>=a&&c.date<=b),`مكالمات-${a}-لـ-${b}.csv`);break}
    case 'export-month':{const ym=ymOf(today());exportList(all().filter(c=>c.ym===ym||ymOf(c.date)===ym),`مكالمات-${ym}.csv`);break}
    case 'period':ui.period=id;render();break;
    case 'my-follows':ui.fAgent=ui.fAgent===ui.me?'':ui.me;render();break;
    case 'follow-done':{const c=S.calls[id];if(c){const {ym,...b}=c;await Store.put({...b,followDone:true,followDoneAt:Date.now()},{...c});toast('المتابعة اتقفلت')}break}
    case 'follow-tomorrow':{const c=S.calls[id];if(c){const {ym,...b}=c;await Store.put({...b,followDate:addDays(today(),1)},{...c});toast('اتأجلت لبكرة')}break}
    case 'log-follow':{const c=S.calls[id];if(c)openCall(null,{client:c.client,company:c.company,phone:c.phone,industry:c.industry,source:c.source,city:c.budget,services:c.services||[],heat:c.heat,linkFrom:c.id,agent:ui.me||c.agent});break}
    case 'copy':{const v=el.dataset.v||'';try{await navigator.clipboard.writeText(v);toast('اتنسخ الرقم')}catch(err){toast('علّم الرقم وانسخه من الجهاز')}break}
    case 'save-settings':await Store.putSettings({company:$('#setCo').value.trim()||'وكالتي',dailyTarget:Number($('#setTarget').value)||0});toast('اتحفظت الإعدادات');break;
    case 'add-member':{const n=$('#newMember').value.trim();if(!n){toast('اكتب الاسم');break}if(team().some(m=>m.name===n)){toast('الاسم ده موجود');break}await Store.putSettings({team:[...team(),{id:uid(),name:n}]});toast('اتضاف '+n);break}
    case 'del-member':await Store.putSettings({team:team().filter(m=>m.id!==id)});toast('اتشال الاسم. مكالماته القديمة زي ما هي');break;
    case 'seed':seedDemo();break;
    case 'clear-demo':clearDemo();break;
    case 'theme':if(id)document.documentElement.dataset.theme=id;else delete document.documentElement.dataset.theme;lsSet('calls_theme',id);render();break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.actChange==='status'){const c=S.calls[t.dataset.id];if(c&&c.status!==t.value){const {ym,...b}=c;const s=ST[t.value];const n={...b,status:t.value,updatedAt:Date.now()};if(!c.followDate&&s.follow){n.followDate=addDays(today(),s.follow);n.followDone=false}await Store.put(n,{...c});toast('اتغيرت النتيجة: '+s.l+(n.followDate&&!c.followDate?' — واتحددت متابعة '+relDay(n.followDate):''))}return}
  const b=t.dataset&&t.dataset.bind;if(!b)return;
  if(b==='me'){ui.me=t.value;lsSet('calls_me',t.value);render();return}
  if(b==='date'){if(t.value){ui.date=t.value;render()}return}
  if(b==='q'||b==='cq')return;
  ui[b]=t.value;render();
});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b==='q'||b==='cq'){ui[b]=e.target.value;render()}});
document.addEventListener('click',e=>{const lbl=e.target.closest('.daydate');if(lbl){const i=$('#dayPick');if(i){try{i.showPicker()}catch(err){i.focus()}}}});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
setInterval(()=>{const a=document.activeElement;if(!dlg.open&&!dlg2.open&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&ui.view==='follow')render()},60000);

/* =========================================================
   التشغيل والربط السحابي مع Firebase
   ========================================================= */
try{const th=lsGet('calls_theme','');if(th)document.documentElement.dataset.theme=th}catch(e){}

function init(){
  ui.ready=true;
  render();

  let db=null;
  if(typeof firebase!=='undefined'&&firebaseConfig.projectId){
    try{
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }catch(e){
      console.warn("Firebase failed to init, falling back to local:", e);
    }
  }

  if(!db){
    Store.mode='local';
    Store.lsLoad();
    for(const id in S.calls) S.calls[id].ym=ymOf(S.calls[id].date);
    scheduleRender();
    return;
  }

  Store.mode='db';
  Store.db=db;
  Store.canWrite=true;

  // متابعة الإعدادات السحابية
  try{
    Store.settingsDoc().onSnapshot(s=>{
      S.settings=s.exists?{...DEF,...s.data()}:{...DEF};
      scheduleRender();
    }, err=>{
      console.warn("Settings error:", err);
      scheduleRender();
    });
  }catch(e){console.warn("Settings error:", e)}

  // الاشتراك اللحظي في مكالمات الشهور
  const cur=ymOf(today());
  Store.ensure(cur);
  Store.ensure(addMonthsYM(cur,-1));
}

// بدء التشغيل
init();
</script>
